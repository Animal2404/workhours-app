name: Build Android APK

# 云端编译：不用在本地装 Android SDK，推送到 GitHub 就自动出安装包。
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-apk:
    name: 构建 APK
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 安装 Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: 安装 JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      # 注意：不要加 android-actions/setup-android。
      # GitHub 托管的 ubuntu runner 已经自带 Android SDK，
      # 官方文档也说明该 action 是给自托管 runner 用的；
      # 它的旧版本还依赖已弃用的 Node 20，会导致构建在第一步就失败。
      - name: 确认 Android SDK 可用
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          if [ -z "$ANDROID_HOME" ] && [ -z "$ANDROID_SDK_ROOT" ]; then
            echo "::error::runner 上没有找到 Android SDK"
            exit 1
          fi
          ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}" | head -20
          # 构建用的 platform 与 build-tools 必须存在
          ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platforms" | tail -5
          ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" | tail -5

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 工资引擎自检
        run: npm run check

      - name: 存款目标 / 累计 / 老数据迁移自检
        run: npm run check:savings

      - name: 签名注入脚本自检（含版本号注入）
        run: npm run check:signing

      - name: 主题配色自检（对比度 + 色相纪律 + 首帧底色一致性）
        run: npm run check:theme

      # 帧率：**只报告，不拦构建**。
      # 共享 runner 上 rAF 节奏抖动大，同一场景两次能差一倍；
      # 拿它当门会变成随机红。数字仍然打印出来，便于人工比对趋势。
      - name: 帧率报告（不拦构建）
        run: npm run check:fps
        continue-on-error: true

      - name: 节假日数据自检
        run: npm run check:holidays

      - name: Android 资源自检
        run: npm run check:android

      - name: 类型检查
        run: npm run typecheck

      - name: 构建前端（Vite）
        run: npm run build

      - name: 添加 Android 平台
        run: npx cap add android

      - name: 装入图标与启动画面
        run: npm run icons:apply

      - name: 同步 Web 资源到 Android 工程
        run: npx cap sync android

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 准备固定签名密钥
        run: |
          # signing/workhours.keystore 是提交进仓库的「固定调试签名」。
          # 为什么必须固定：若每次构建都现场生成一把随机钥匙，新 APK 与手机上
          # 已装的旧版签名不一致，Android 会拒绝覆盖安装，只能卸载重装 ——
          # 那会清空用户本地的工时数据。
          # 若配置了 secrets，则优先使用你自己的正式签名。
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
            echo "✅ 使用仓库配置的正式签名"
            echo "CI_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "CI_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "CI_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            cp signing/workhours.keystore android/app/release.keystore
            echo "✅ 使用仓库内固定签名（覆盖安装不会丢数据）"
            echo "CI_STORE_PASSWORD=workhours" >> "$GITHUB_ENV"
            echo "CI_KEY_ALIAS=workhours" >> "$GITHUB_ENV"
            echo "CI_KEY_PASSWORD=workhours" >> "$GITHUB_ENV"
          fi

      - name: 注入签名配置
        run: |
          # 用脚本注入，不用 sed：
          # 签名块里有引号、`?:`、括号，shell 逐层转义极易出错，
          # 而 Groovy 少一个引号就会让整个构建失败。
          python3 scripts/inject-signing.py

      - name: 构建 Debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 构建 Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 校验 APK 签名一致（升级安装的前提）
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort | tail -1)
          echo "apksigner: $APKSIGNER"
          for apk in $(find android/app/build/outputs/apk -name "*.apk"); do
            echo "--- $apk ---"
            "$APKSIGNER" verify --print-certs "$apk" | grep -i "certificate DN\|SHA-256 digest" | head -4
          done

      - name: 校验 APK 里的版本号与 package.json 一致
        run: |
          # 注入脚本是否真的把版本写进了 APK？光看 build.gradle 不够，
          # 这里直接读 APK 的 manifest。不一致就拦住 —— 否则 Releases 页写的
          # 版本号会和手机上「应用信息」里显示的对不上。
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 -type f | sort | tail -1)
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "aapt2: $AAPT"
          echo "apk:   $APK"
          VERSION=$(node -p "require('./package.json').version")
          BADGING=$("$AAPT" dump badging "$APK" | grep -E "^package:")
          echo "$BADGING"
          if echo "$BADGING" | grep -q "versionName='$VERSION'"; then
            echo "✓ APK versionName = $VERSION（与 package.json 一致）"
          else
            echo "✗ APK versionName 与 package.json 不一致，期望 $VERSION"
            exit 1
          fi

      - name: 整理产物
        run: |
          mkdir -p out
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          # 统一命名，方便下载。
          # ⚠️ 这里**必须用 ASCII**：softprops/action-gh-release 会把附件名里的
          #    非 ASCII 字符替换成 '-'，中文名「工时记-debug.apk」传到 Release 上
          #    会变成「-debug.apk」（真的发生过）。Release 标题里可以用中文。
          for f in out/*debug*.apk; do [ -e "$f" ] && mv "$f" "out/WorkHours-debug.apk"; done
          for f in out/*release*.apk; do [ -e "$f" ] && mv "$f" "out/WorkHours.apk"; done
          ls -lh out/

      - name: 上传 APK（构建产物）
        uses: actions/upload-artifact@v4
        with:
          name: 工时记-APK
          path: out/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: 读取版本号
        id: ver
        run: echo "APP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: 发布到 Releases（滚动更新，下载链接永久有效）
        # 之前这里写的是 `if: github.event_name == 'release'` —— 只有「被 release 事件触发」才跑，
        # 但本工作流是 push 触发的，所以这一步**从来没执行过**，Releases 页一直是空的。
        # 现在改成：只要推送到主分支就滚动更新同一个 Release（固定 tag = latest）。
        #   好处：下载链接永久有效，不用每次换
        #         https://github.com/Animal2404/workhours-app/releases/latest/download/工时记.apk
        #   旧版仍可在 Actions 的构建产物里取（保留 90 天）
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 工时记 v${{ env.APP_VERSION }}（最新版）
          make_latest: true
          body: |
            ## 工时记 · 最新构建

            点下面的 **WorkHours.apk** 下载，传到手机上安装即可。

            - 版本：**v${{ env.APP_VERSION }}**
            - 提交：`${{ github.sha }}`
            - 构建：${{ github.event.head_commit.timestamp }}

            ### 安装说明
            - **覆盖安装不会丢数据**：本包使用仓库里固定的签名，
              可以直接覆盖安装旧版，本地工时记录保留。
            - 如果是第一次装、或之前用的是别的签名，需要先卸载旧版再装。
            - 安装时若提示「未知来源」，在系统设置里允许安装未知应用即可。

            ### 两个包怎么选
            | 附件 | 说明 |
            |---|---|
            | `WorkHours.apk` | **装这个**，正式包，体积更小 |
            | `WorkHours-debug.apk` | 调试包，排查问题时用 |

            每次推送到主分支，这里都会自动重新构建并更新（包括下面的 APK 附件）。
            下载链接永久有效：`releases/latest/download/WorkHours.apk`
          files: out/*.apk
          fail_on_unmatched_files: true
